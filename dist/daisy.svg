<?xml version="1.0" encoding="UTF-8"?>
<!-- Detailed daisy SVG with many thin petals, gradient center, and subtle shadow -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <g filter="url(#daisy-shadow)">
    <!-- 16 thin, slightly curved petals -->
    <g stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M 50 5 L 50 15" />
      <path d="M 50 95 L 50 85" />
      <path d="M 5 L 50" />
      <path d="M 95 L 50" />
      <path d="M 25 25 L 40 30 L 55 35" />
      <path d="M 75 25 L 60 30 L 45 35" />
      <path d="M 25 75 L 40 70 L 55 65" />
      <path d="M 75 75 L 60 70 L 45 65" />
      <path d="M 35 15 L 45 22 L 55 28" />
      <path d="M 65 15 L 55 22 L 45 28" />
      <path d="M 35 85 L 45 78 L 55 72" />
      <path d="M 65 85 L 55 78 L 45 72" />
      <path d="M 25 45 L 35 52 L 45 59" />
      <path d="M 75 45 L 65 52 L 55 59" />
      <path d="M 35 55 L 40 60 L 45 65" />
      <path d="M 65 55 L 60 60 L 55 65" />
    </g>
    <!-- Gradient center -->
    <circle cx="50" cy="50" r="20" fill="#fcd35d"/>
    <circle cx="50" cy="50" r="12" fill="#eab308"/>
    <circle cx="50" cy="50" r="5" fill="#d49a29"/>
    <!-- Petal veins (subtle) -->
    <g fill="none" stroke="#d4a5a5" stroke-width="0.5" opacity="0.6">
      <path d="M 50 5 L 50 12" />
      <path d="M 50 95 L 50 88" />
      <path d="M 5 L 50 L 50" />
      <path d="M 95 L 50 L 50" />
    </g>
  </g>
  <defs>
    <filter id="daisy-shadow" x="-20" y="-20" width="120" height="120">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
</svg>