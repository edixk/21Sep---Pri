<?xml version="1.0" encoding="UTF-8"?>
<!-- Detailed sunflower SVG with layered petals, textured center, and gradient -->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <g filter="url(#sunflower-shadow)">
    <!-- Layered petals - 3 rows for depth -->
    <g transform="rotate(-90 60 60)">
      <!-- Bottom petal row -->
      <path d="M 60 15 Q 45 20 35 45 Q 25 65 35 85 Q 45 105 60 105 Q 75 105 85 85 Q 95 65 95 45 Q 95 25 80 15 Q 65 5 60 15 Z" fill="#fcd35d"/>
      <path d="M 60 15 Q 70 20 75 45 Q 80 65 75 85 Q 70 105 60 105 Q 50 105 45 85 Q 40 65 40 45 Q 40 25 55 15 Z" fill="#febf17"/>
      <path d="M 60 15 Q 45 10 35 25 Q 25 40 35 55 Q 30 70 45 80 Q 60 90 60 105 Q 60 90 55 80 Q 50 60 45 45 Z" fill="#fcd35d"/>
      <!-- Middle petal row -->
      <path d="M 60 45 Q 40 50 30 65 Q 20 80 35 95 Q 50 110 60 110 Q 70 110 80 95 Q 90 80 90 65 Q 90 50 80 45 Q 75 50 65 55 Z" fill="#febf17"/>
      <path d="M 60 45 Q 75 50 85 65 Q 95 80 85 95 Q 100 110 100 110 Q 110 110 110 95 Q 120 80 120 65 Q 120 50 110 55 Z" fill="#fcd35d"/>
      <!-- Top petal row -->
      <path d="M 60 75 Q 45 80 35 90 Q 25 100 35 110 Q 45 120 60 120 Q 75 120 85 110 Q 95 100 95 90 Q 95 80 85 75 Q 80 70 65 70 Z" fill="#febf17"/>
      <path d="M 60 75 Q 70 80 78 92 Q 85 102 85 112 Q 95 122 95 122 Q 105 122 105 112 Q 115 112 115 92 Q 122 80 122 65 Q 122 50 115 55 Z" fill="#fcd35d"/>
    </g>
    <!-- Textured center -->
    <circle cx="60" cy="60" r="22" fill="#b8860b"/>
    <circle cx="60" cy="60" r="14" fill="#8b5a2b"/>
    <circle cx="60" cy="60" r="6" fill="#4e2d15"/>
    <!-- Seed dots -->
    <g fill="#f5e9dc">
      <circle cx="45" cy="45" r="1.5"/>
      <circle cx="75" cy="45" r="1.5"/>
      <circle cx="75" cy="75" r="1.5"/>
      <circle cx="45" cy="75" r="1.5"/>
    </g>
  </g>
  <defs>
    <filter id="sunflower-shadow" x="0" y="0" width="120" height="120">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
</svg>