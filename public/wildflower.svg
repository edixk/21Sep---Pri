<?xml version="1.0" encoding="UTF-8"?>
<!-- Detailed wildflower SVG with irregular layered petals, natural variation, and stem -->
<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90" fill="none">
  <g filter="url(#wildflower-shadow)">
    <!-- Irregular petals with natural variation - 12 petals, no two identical -->
    <g stroke="#f59e0b" stroke-width="1.2" fill="none" stroke-linecap="round">
      <!-- Petal 1 -->
      <path d="M 45 10 Q 48 8 52 12 Q 56 15 55 22 Q 54 28 50 35 Q 46 42 42 38 Q 35 35 30 28 Q 25 22 27 12 Q 30 8 45 10 Z" />
      <!-- Petal 2 -->
      <path d="M 45 90 Q 47 92 52 88 Q 56 85 55 78 Q 54 72 50 65 Q 46 58 42 62 Q 35 70 30 72 Q 25 85 27 90 Q 30 90 45 90 Z" />
      <!-- Petal 3 -->
      <path d="M 10 45 Q 12 48 18 52 Q 22 55 23 62 Q 24 68 20 75 Q 18 82 15 88 Q 12 90 10 90 Q 15 90 18 85 Q 20 80 22 70 Z" />
      <!-- Petal 4 -->
      <path d="M 80 45 Q 78 47 73 52 Q 68 55 67 62 Q 66 68 62 75 Q 60 80 55 88 Q 50 90 50 90 Q 50 90 53 88 Q 56 80 57 70 Z" />
      <!-- Petal 5 -->
      <path d="M 30 10 Q 33 8 37 12 Q 40 15 38 22 Q 37 28 35 35 Q 32 42 28 38 Q 25 35 27 28 Q 30 22 32 12 Q 35 8 30 10 Z" />
      <!-- Petal 6 -->
      <path d="M 70 10 Q 73 8 76 12 Q 79 15 78 22 Q 77 28 73 35 Q 70 42 68 38 Q 65 42 62 35 Q 60 22 62 12 Q 65 8 68 10 Z" />
      <!-- Petal 7 -->
      <path d="M 15 80 Q 17 82 22 87 Q 27 87 32 82 Q 35 82 37 77 Q 38 72 38 65 Q 38 58 37 52 Q 37 45 35 48 Q 32 55 30 60 Z" />
      <!-- Petal 8 -->
      <path d="M 70 80 Q 72 82 77 87 Q 82 87 87 82 Q 90 82 90 77 Q 90 72 88 65 Q 87 58 86 52 Q 85 52 83 60 Z" />
    </g>
    <!-- Center with texture -->
    <circle cx="50" cy="50" r="18" fill="#f59e0b"/>
    <circle cx="50" cy="50" r="10" fill="#eab308"/>
    <circle cx="50" cy="50" r="3" fill="#d49a29"/>
    <!-- Stem -->
    <path d="M 50 88 Q 50 95 48 97" stroke="#7fba00" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="48" cy="97" rx="3" ry="5" fill="#7fba00"/>
    <!-- Leaf -->
    <path d="M 45 92 Q 40 98 35 95 Q 30 93 32 88 Q 33 85 38 82" fill="#7fba00"/>
  </g>
  <defs>
    <filter id="wildflower-shadow" x="-20" y="-20" width="110" height="110">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
</svg>